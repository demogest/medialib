# Builds every download and publishes them as one GitHub release, with notes and checksums.
#
# Pushing a v* tag releases it. Running the workflow by hand (Actions > release > Run workflow) is a dry run: it builds
# everything and writes the notes and checksums, keeps them as the run's artifacts and shows the notes on the run's
# page, but publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to try, e.g. v3.2.0 (nothing is published)"
        required: true
        default: v0.0.0-dryrun
permissions:
  contents: read
env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      # the Windows .exe files carry the version in their Properties > Details too
      - run: make winres cross VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with: { name: server, path: dist/*, if-no-files-found: error }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: choco install innosetup -y --no-progress
      - run: powershell -NoProfile -File scripts/package-windows.ps1 -Version "$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/medialib-setup-*.exe
            dist/medialib-desktop-windows-*.zip
  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: sh scripts/build-desktop.sh dist/medialib-desktop-${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: dist/*, if-no-files-found: error }
  # Only once every build has succeeded: a release is never published with some of its files missing.
  publish:
    needs: [server, windows, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # actions/checkout can leave an annotated tag as a plain one, which would lose its message for the notes
      - if: github.event_name == 'push'
        run: git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          sh scripts/release-notes.sh "$VERSION" > release-notes.md
          { echo "# $VERSION"; echo; cat release-notes.md; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l dist
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            release-notes.md
            dist/SHA256SUMS
