# Builds every download and publishes them as one GitHub release, with notes and checksums.
#
# Pushing a v* tag releases it. So does running the workflow by hand (Actions > release > Run workflow) on main with
# "publish" ticked: the release and its tag are made on the commit the run built. Without "publish" a run by hand is a
# dry run: it builds everything and writes the notes and checksums, keeps them as the run's artifacts and shows the
# notes on the run's page, but publishes nothing.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v3.2.0"
        required: true
        default: v0.0.0-dryrun
      publish:
        description: "Publish it: tag main's commit with the version and release it (otherwise a dry run)"
        type: boolean
        default: false
# One run per version at a time: a second one waits, then finds the version released and stops at the check.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
permissions:
  contents: read
env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
jobs:
  # A release by hand is checked before anything is built: from main, a plain version number, not released yet.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are made from main, not $GITHUB_REF"; exit 1; }
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$VERSION is not a version like v3.2.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged"; exit 1
          fi
  server:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      # the Windows .exe files carry the version in their Properties > Details too
      - run: make winres cross VERSION="$VERSION"
      - uses: actions/upload-artifact@v5
        with: { name: server, path: dist/*, if-no-files-found: error }
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - run: choco install innosetup -y --no-progress
      - run: powershell -NoProfile -File scripts/package-windows.ps1 -Version "$env:VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/medialib-setup-*.exe
            dist/medialib-desktop-windows-*.zip
  desktop:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: sh scripts/build-desktop.sh dist/medialib-desktop-${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v5
        with: { name: "desktop-${{ matrix.name }}", path: dist/*, if-no-files-found: error }
  # Only once every build has succeeded: a release is never published with some of its files missing.
  publish:
    needs: [server, windows, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # actions/checkout can leave an annotated tag as a plain one, which would lose its message for the notes
      - if: github.event_name == 'push'
        run: git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
      # a release by hand: tagged here for the notes, and on GitHub along with the release below
      - if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: git tag "$VERSION" "$GITHUB_SHA"
      - uses: actions/download-artifact@v6
        with: { path: build, merge-multiple: true }
      # the builds' own outputs become medialib-<version>-<os>-<arch>[-<kind>] archives (scripts/package-release.sh)
      - name: Package, checksums and notes
        run: |
          sh scripts/package-release.sh "$VERSION" build dist
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          sh scripts/release-notes.sh "$VERSION" dist > release-notes.md
          { echo "# $VERSION"; echo; cat release-notes.md; echo; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -l dist
      - if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
      - if: github.event_name != 'push' && !inputs.publish
        uses: actions/upload-artifact@v5
        with:
          name: release-preview
          path: |
            release-notes.md
            dist/SHA256SUMS
