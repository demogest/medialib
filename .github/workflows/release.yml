name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make cross VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest, name: darwin-arm64 }
          - { os: windows-latest, name: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: sh scripts/build-desktop.sh dist/medialib-desktop-${{ matrix.name }}
        shell: bash
        env: { VERSION: "${{ github.ref_name }}" }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
